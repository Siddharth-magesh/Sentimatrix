[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentimatrix"
version = "0.2.1"
description = "Advanced sentiment analysis toolkit with multi-provider LLM support and web scraping capabilities"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sentimatrix Team", email = "siddhartmagesh007@gmail.com"},
]
keywords = [
    "sentiment-analysis",
    "nlp",
    "llm",
    "machine-learning",
    "web-scraping",
    "emotion-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "tenacity>=8.2.0",
    "structlog>=23.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.4.0",
    "groq>=0.4.0",
    "mistralai>=0.1.0",
    "together>=0.2.0",
    "cohere>=4.0.0",
]
scraping = [
    "playwright>=1.40.0",
    "selenium>=4.15.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]
models = [
    "transformers>=4.36.0",
    "torch>=2.0.0",
    "tokenizers>=0.15.0",
]
audio = [
    "openai-whisper>=20231117",
    "pydub>=0.25.0",
    "soundfile>=0.12.0",
]
visualization = [
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "pandas>=2.1.0",
]
cache = [
    "redis>=5.0.0",
    "aiosqlite>=0.19.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "hypothesis>=6.92.0",
]
all = [
    "sentimatrix[llm,scraping,models,audio,visualization,cache,dev]",
]

[project.urls]
Homepage = "https://github.com/sentimatrix/sentimatrix"
Documentation = "https://sentimatrix.dev/docs"
Repository = "https://github.com/sentimatrix/sentimatrix"
Changelog = "https://github.com/sentimatrix/sentimatrix/blob/main/CHANGELOG.md"

[project.scripts]
sentimatrix = "sentimatrix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sentimatrix"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict parameter
]

[tool.ruff.per-file-ignores]
"tests/**/*" = ["ARG", "S101"]

[tool.black]
target-version = ["py310"]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["transformers.*", "torch.*", "playwright.*", "selenium.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "live: marks tests that require live API access",
]

[tool.coverage.run]
source = ["sentimatrix"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
