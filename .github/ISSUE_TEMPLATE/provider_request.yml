name: New Provider/Scraper Request
description: Request support for a new LLM provider, platform, or commercial API
title: "[Provider]: "
labels: ["provider-request", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new provider or scraper! Please provide details below.

  - type: dropdown
    id: type
    attributes:
      label: Provider Type
      description: What type of provider/scraper is this?
      options:
        - LLM Provider (Cloud API)
        - LLM Provider (Local/Self-hosted)
        - Platform Scraper
        - Commercial Scraping API
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Provider/Platform Name
      description: Name of the provider or platform
      placeholder: "e.g., Perplexity AI, TripAdvisor, Proxycrawl"
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: Website/Documentation
      description: Link to the provider's website or API documentation
      placeholder: "https://..."
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Why do you need this provider? What's your use case?
    validations:
      required: true

  - type: textarea
    id: api-info
    attributes:
      label: API Information
      description: Any relevant API details (authentication method, endpoints, rate limits, etc.)

  - type: checkboxes
    id: features
    attributes:
      label: Required Features
      description: What features should this provider support?
      options:
        - label: Async support
        - label: Streaming responses
        - label: Rate limiting
        - label: Retry logic
        - label: Batch processing

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be willing to help implement this?
      options:
        - label: I'm willing to submit a PR
        - label: I have API access for testing
        - label: I can provide sample data/responses

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context or information.
