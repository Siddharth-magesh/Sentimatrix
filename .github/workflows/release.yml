name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.1)"
        required: true
        type: string
      prerelease:
        description: "Publish as pre-release (TestPyPI)"
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Validate version
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi
          if git tag | grep -q "^v$VERSION$"; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # Build package
  # ---------------------------------------------------------------------------
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------------
  # GitHub release
  # ---------------------------------------------------------------------------
  github-release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: sentimatrix v${{ needs.validate.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: dist/*

  # ---------------------------------------------------------------------------
  # Publish to PyPI / TestPyPI (Trusted Publishing)
  # ---------------------------------------------------------------------------
  publish:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: ${{ github.event.inputs.prerelease && 'testpypi' || 'pypi' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event.inputs.prerelease && 'https://test.pypi.org/legacy/' || '' }}
          verbose: true
