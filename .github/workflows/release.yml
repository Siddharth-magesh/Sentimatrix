name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.1)"
        required: true
        type: string
      prerelease:
        description: "Publish to TestPyPI"
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: "3.11"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ------------------------------------------------------------------
      # Verify version matches pyproject.toml
      # ------------------------------------------------------------------
      - name: Verify version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          FILE_VERSION=$(grep '^version =' pyproject.toml | cut -d '"' -f2)
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Version mismatch: input=$VERSION, pyproject.toml=$FILE_VERSION"
            exit 1
          fi

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - name: Build package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      # ------------------------------------------------------------------
      # Tag AFTER successful build
      # ------------------------------------------------------------------
      - name: Create Git tag
        run: |
          git tag v${{ github.event.inputs.version }}
          git push origin v${{ github.event.inputs.version }}

      # ------------------------------------------------------------------
      # Publish (Trusted Publishing)
      # ------------------------------------------------------------------
      - name: Publish to PyPI / TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event.inputs.prerelease && 'https://test.pypi.org/legacy/' || '' }}
          verbose: true
